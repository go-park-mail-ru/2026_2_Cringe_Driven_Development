name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=5m

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-test
          POSTGRES_DB: backend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d backend_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_POSTGRES_DSN: postgres://postgres:postgres-test@127.0.0.1:5432/backend_test?sslmode=disable
      RUNTIME_TEST_DATABASE_URL: postgres://postgres:postgres-test@127.0.0.1:5432/backend_test?sslmode=disable
      REDIS_TEST_ADDR: 127.0.0.1:6379
      REDIS_RECOVERY_TESTS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Redis CLI for recovery runbook tests
        # redis-cli берём из уже скачанного образа service-контейнера: apt-зеркала Ubuntu на runner часто не резолвятся.
        run: |
          printf '%s\n' '#!/bin/sh' 'exec docker run --rm -i --network host -e REDISCLI_AUTH redis:8-alpine redis-cli "$@"' |
            sudo tee /usr/local/bin/redis-cli > /dev/null
          sudo chmod +x /usr/local/bin/redis-cli
          redis-cli -h 127.0.0.1 ping
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install release callback test tools
        run: python -m pip install ansible-core==2.19.7
      - name: Release producer contract tests
        run: python3 -m unittest discover -s scripts/release/tests -v
      - name: Check dependencies
        run: go mod tidy -diff
      - name: Build
        run: go build ./...
      - name: Test
        run: make test

  runtime-agent:
    name: runtime-agent
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: runtime-agent/requirements*.txt
      - name: Install agent and test dependencies
        run: make agent-setup
      - name: Ruff check
        run: >-
          runtime-agent/.venv/bin/ruff check --output-format=github
          runtime-agent/src runtime-agent/tests runtime-agent/images
      - name: Ruff format
        run: >-
          runtime-agent/.venv/bin/ruff format --check
          runtime-agent/src runtime-agent/tests runtime-agent/images
      - name: Unit tests
        run: make agent-test
      - name: Build package
        run: make agent-build
      - name: Build Python kernel image
        run: make agent-images
      - name: Test real kernels, isolation, limits and recovery
        run: make agent-integration

  kernel-images:
    name: kernel-images
    runs-on: ubuntu-latest
    needs: [runtime-agent]
    timeout-minutes: 30
    outputs:
      python_ref: ${{ steps.refs.outputs.python_ref }}
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.repository == 'Cringe-Driven-Development-Team/backend' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Python kernel
        id: python
        uses: docker/build-push-action@v7
        with:
          context: runtime-agent
          file: runtime-agent/images/python.Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' }}
          tags: ghcr.io/cringe-driven-development-team/cellestial-kernel-python:sha-${{ github.sha }}
          cache-from: type=gha,scope=kernel-python
          cache-to: type=gha,mode=max,scope=kernel-python
      - name: Export image references
        id: refs
        env:
          PYTHON_DIGEST: ${{ steps.python.outputs.digest }}
        run: |
          if [[ "$PUBLISH" == "true" ]]; then
            [[ "$PYTHON_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "python_ref=ghcr.io/cringe-driven-development-team/cellestial-kernel-python@${PYTHON_DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "python_ref=cellestial-kernel-python:local" >> "$GITHUB_OUTPUT"
          fi

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: [lint, test, kernel-images]
    outputs:
      image_ref: ${{ steps.deployment.outputs.image_ref }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        if: github.repository == 'Cringe-Driven-Development-Team/backend' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: printf 'name=ghcr.io/%s\n' "${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Sanitize ref name
        id: ref
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          name=${REF_NAME,,}
          name=${name//[^a-z0-9._-]/-}
          echo "name=${name}" >> "$GITHUB_OUTPUT"
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=raw,value=pr-${{ steps.ref.outputs.name }}-{{sha}},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=main,enable=${{ github.repository == 'Cringe-Driven-Development-Team/backend' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/main.Dockerfile
          push: ${{ github.repository == 'Cringe-Driven-Development-Team/backend' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}
          build-args: |
            RUNTIME_PYTHON_IMAGE=${{ needs.kernel-images.outputs.python_ref }}
            RUNTIME_AGENT_VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export deployment image reference
        id: deployment
        if: github.repository == 'Cringe-Driven-Development-Team/backend' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image_ref=$IMAGE_NAME@$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Verify public package and anonymous digest access
        if: github.repository == 'Cringe-Driven-Development-Team/backend' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          BACKEND_IMAGE_REF: ${{ steps.deployment.outputs.image_ref }}
        run: |
          set -euo pipefail
          metadata=$(gh api orgs/Cringe-Driven-Development-Team/packages/container/backend)
          jq -e --arg repository "$EXPECTED_REPOSITORY" \
            '.visibility == "public" and .repository.full_name == $repository' <<< "$metadata" > /dev/null
          jq '{visibility, repository: .repository.full_name}' <<< "$metadata"
          docker_config=$(mktemp -d)
          trap 'rm -rf "$docker_config"' EXIT
          docker --config "$docker_config" pull --platform linux/amd64 "$BACKEND_IMAGE_REF"

  deploy:
    name: deploy
    needs: docker
    if: github.repository == 'Cringe-Driven-Development-Team/backend' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_ENABLED == 'true'
    permissions:
      contents: read
      actions: read
      deployments: write
    uses: ./.github/workflows/cd.yml
    with:
      action: deploy
      target_sha: ${{ github.sha }}
      backend_image_ref: ${{ needs.docker.outputs.image_ref }}
    secrets: inherit

  course-sync:
    needs: [lint, test, docker]
    if: github.repository == 'Cringe-Driven-Development-Team/backend' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.COURSE_SYNC_ENABLED == 'true'
    permissions:
      contents: read
      actions: read
    uses: Cringe-Driven-Development-Team/.github/.github/workflows/sync-to-course.yml@d807366e2fc048426e396c79cbb921d12cc23dc7
    with:
      sha: ${{ github.sha }}
      ci_run_id: ${{ format('{0}', github.run_id) }}
      automation_ref: d807366e2fc048426e396c79cbb921d12cc23dc7
    secrets:
      COURSE_SYNC_SSH_KEY: ${{ secrets.COURSE_SYNC_SSH_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
