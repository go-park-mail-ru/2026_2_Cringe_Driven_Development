name: Уведомления в Telegram

on:
  push:
    branches-ignore: [main]
  issues:
    types: [opened, closed, reopened]
  pull_request:
    types: [opened, ready_for_review, closed, review_requested]
  pull_request_review:
    types: [submitted]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Отправить сообщение
        env:
          TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT:      ${{ vars.TELEGRAM_CHAT_ID }}
          TOPIC:     ${{ vars.TELEGRAM_TOPIC_ID }}
          MAP:       ${{ vars.TELEGRAM_USER_MAP }}
          EVENT:     ${{ github.event_name }}
          ACTION:    ${{ github.event.action }}
          MERGED:    ${{ github.event.pull_request.merged }}
          REVIEW:    ${{ github.event.review.state }}
          REVIEWER:  ${{ github.event.requested_reviewer.login }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR:     ${{ github.actor }}
          REPO:      ${{ github.repository }}
          NUMBER:    ${{ github.event.issue.number || github.event.pull_request.number }}
          TITLE:     ${{ github.event.issue.title || github.event.pull_request.title }}
          URL:       ${{ github.event.issue.html_url || github.event.pull_request.html_url }}
          BRANCH:    ${{ github.event.ref }}
          COMMITS:   ${{ toJSON(github.event.commits) }}
          COMPARE:   ${{ github.event.compare }}
          FORCED:    ${{ github.event.forced }}
          ASSIGNEES: ${{ toJSON(github.event.issue.assignees) }}
        run: |
          WHO="$ACTOR"
          MARKUP='{"inline_keyboard":[]}'

          esc () { printf '%s' "$1" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'; }

          # 1 коммит / 2 коммита / 5 коммитов
          plural () {
            case "$(($1 % 100))" in
              11|12|13|14) printf 'коммитов' ;;
              *) case "$(($1 % 10))" in
                   1)     printf 'коммит' ;;
                   2|3|4) printf 'коммита' ;;
                   *)     printf 'коммитов' ;;
                 esac ;;
            esac
          }

          case "$EVENT:$ACTION" in
            push:)
              COUNT=$(printf '%s' "$COMMITS" | jq 'length')
              # создание и удаление ветки, пуш тега — событие есть, коммитов нет
              [ "$COUNT" -eq 0 ] && exit 0
              if [ "$FORCED" = "true" ]; then
                HEAD="⚠️ $COUNT $(plural "$COUNT") (force-push)"
              else
                HEAD="⚒️ $COUNT $(plural "$COUNT")"
              fi ;;
            issues:opened)   HEAD="🆕 Новая задача" ;;
            issues:closed)   HEAD="✅ Задача закрыта" ;;
            issues:reopened) HEAD="♻️ Задача переоткрыта" ;;
            pull_request:opened|pull_request:ready_for_review)
                             HEAD="🔀 Открыт pull request" ;;
            pull_request:review_requested)
              # ревью может быть запрошено у команды — тогда упоминать некого
              [ -z "$REVIEWER" ] && exit 0
              HEAD="👀 Запрошено ревью"
              WHO="$REVIEWER" ;;
            pull_request:closed)
              if [ "$MERGED" = "true" ]; then
                HEAD="🎉 Влито в main"
              else
                HEAD="🚫 PR закрыт без мержа"
              fi ;;
            pull_request_review:submitted)
              case "$REVIEW" in
                approved)          HEAD="👍 Апрув";            WHO="$PR_AUTHOR" ;;
                changes_requested) HEAD="✋ Запрошены правки";  WHO="$PR_AUTHOR" ;;
                *)                 exit 0 ;;
              esac ;;
            *) exit 0 ;;
          esac

          case "$REPO" in
            frontend-park-mail-ru/*) SIDE="frontend" ;;
            go-park-mail-ru/*)       SIDE="backend" ;;
            *)                       SIDE="${REPO#*/}" ;;
          esac

          # логин есть в карте — кликабельное упоминание, нет — просто текст
          mention () {
            TGID=""
            if [ -n "$MAP" ]; then
              TGID=$(printf '%s' "$MAP" | jq -r --arg u "$1" '.[$u] // empty' 2>/dev/null || true)
            fi
            if [ -n "$TGID" ]; then
              printf '<a href="tg://user?id=%s">%s</a>' "$TGID" "$(esc "$1")"
            else
              esc "$1"
            fi
          }

          if [ "$EVENT" = "push" ]; then
            # у Telegram лимит 4096 символов — длинный пуш иначе отвалится молча
            LIST=$(printf '%s' "$COMMITS" | jq -r '.[0:10][] | "• \(.id[0:7]) \(.message | split("\n")[0])"' | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
            [ "$COUNT" -gt 10 ] && LIST=$(printf '%s\n…и ещё %s' "$LIST" "$((COUNT - 10))")

            BR="${BRANCH#refs/heads/}"
            TEXT=$(printf '<b>%s</b> · %s · <a href="https://github.com/%s/tree/%s">%s</a>\n%s\n%s' \
              "$HEAD" "$SIDE" "$REPO" "$BR" "$(esc "$BR")" "$LIST" "$(mention "$WHO")")
            MARKUP=$(printf '{"inline_keyboard":[[{"text":"Открыть изменения","url":"%s"}]]}' "$COMPARE")
          else
            # у issue номер — единственный идентификатор,
            # у PR он уже есть в заголовке вида "WEB-11: ..."
            if [ "$EVENT" = "issues" ]; then
              REF="#$NUMBER "
              LINE="автор: $(mention "$WHO")"
              NAMES=$(printf '%s' "$ASSIGNEES" | jq -r '[.[].login] | join(" ")' 2>/dev/null || true)
              if [ -n "$NAMES" ]; then
                ML=""
                for N in $NAMES; do
                  [ -n "$ML" ] && ML="$ML, "
                  ML="$ML$(mention "$N")"
                done
                LINE="$LINE · исполнитель: $ML"
              fi
            else
              REF=""
              LINE=$(mention "$WHO")
            fi

            TEXT=$(printf '<b>%s</b> · %s\n<a href="%s">%s%s</a>\n%s' \
              "$HEAD" "$SIDE" "$URL" "$REF" "$(esc "$TITLE")" "$LINE")
          fi

          RESP=$(curl -sS -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT" \
            -d message_thread_id="$TOPIC" \
            -d parse_mode=HTML \
            -d disable_web_page_preview=true \
            --data-urlencode reply_markup="$MARKUP" \
            --data-urlencode text="$TEXT")

          echo "$RESP"

          case "$RESP" in
            *'"ok":true'*) ;;
            *) echo "::error::Telegram отклонил сообщение"; exit 1 ;;
          esac
