name: CD

on:
  workflow_call:
    inputs:
      action:
        description: Production operation (deploy or rollback)
        required: true
        type: string
      target_sha:
        description: Full target SHA; optional for automatic rollback selection
        default: ''
        type: string
      backend_image_ref:
        description: Published digest for deploy; rollback reads its digest from Deployments
        default: ''
        type: string

jobs:
  deploy:
    name: deploy
    permissions:
      contents: read
      actions: read
      deployments: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    environment:
      name: production
      url: https://cellestial.ru
      deployment: false
    concurrency:
      group: backend-production
      cancel-in-progress: false
    env:
      RELEASE_ACTION: ${{ inputs.action }}
      RELEASE_TARGET_SHA: ${{ inputs.target_sha }}
      RELEASE_IMAGE_REF: ${{ inputs.backend_image_ref }}
      PRODUCTION_ENABLED: ${{ vars.PRODUCTION_ENABLED }}
      ANSIBLE_HOST_KEY_CHECKING: "True"
      ANSIBLE_SSH_ARGS: -C -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
    steps:
      - name: Production source preflight
        env:
          SOURCE_WORKFLOW: ${{ github.workflow_ref }}
        run: |
          echo "RELEASE_STATE_FILE=$RUNNER_TEMP/backend-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" >> "$GITHUB_ENV"
          printf '# Backend production: %s\n\nRun: %s/actions/runs/%s/attempts/%s\n\nПодготовка операции; состояние VPS не проверено.\n' \
            "$RELEASE_ACTION" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
          [[ "$GITHUB_REPOSITORY" == 'Cringe-Driven-Development-Team/backend' ]]
          [[ "$GITHUB_REF" == 'refs/heads/main' && "$PRODUCTION_ENABLED" == true ]]
          case "$RELEASE_ACTION:$GITHUB_EVENT_NAME" in
            deploy:push) [[ "$SOURCE_WORKFLOW" == 'Cringe-Driven-Development-Team/backend/.github/workflows/ci.yml@refs/heads/main' ]] ;;
            rollback:workflow_dispatch) [[ "$SOURCE_WORKFLOW" == 'Cringe-Driven-Development-Team/backend/.github/workflows/rollback.yml@refs/heads/main' ]] ;;
            *) exit 1 ;;
          esac
      - name: Checkout release producer
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize operation report
        id: init
        run: python3 scripts/release/release.py init
      - name: Prepare target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/release.py prepare
      - name: Checkout deployment infrastructure
        uses: actions/checkout@v7
        with:
          repository: Cringe-Driven-Development-Team/infra
          ref: main
          path: infra
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install deployment tools
        working-directory: infra/ansible
        run: |
          python -m pip install -r deploy-requirements.txt
          ansible-galaxy collection install -r deploy-requirements.yml
      - name: Prepare SSH and Vault files
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          for name in DEPLOY_SSH_KEY SSH_KNOWN_HOSTS ANSIBLE_VAULT_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing production secret: $name"
              exit 1
            fi
          done
          umask 077
          mkdir -p "$RUNNER_TEMP/backend-deploy"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/backend-deploy/ci-key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/backend-deploy/known_hosts"
          printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > "$RUNNER_TEMP/backend-deploy/vault-pass"
          ssh-keygen -y -f "$RUNNER_TEMP/backend-deploy/ci-key" > "$RUNNER_TEMP/backend-deploy/ci-key.pub"
          ssh-keygen -F cellestial.ru -f "$RUNNER_TEMP/backend-deploy/known_hosts" > /dev/null
          echo "ANSIBLE_VAULT_PASSWORD_FILE=$RUNNER_TEMP/backend-deploy/vault-pass" >> "$GITHUB_ENV"
      - name: Record Deployment in progress
        id: begin
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/release.py begin
      - name: Switch backend
        id: switch
        env:
          ANSIBLE_DIR: ${{ github.workspace }}/infra/ansible
          DEPLOY_KEY_PATH: ${{ runner.temp }}/backend-deploy/ci-key
          JUMP_KNOWN_HOSTS: ${{ runner.temp }}/backend-deploy/known_hosts
        run: python3 scripts/release/release.py switch
      - name: Health check
        id: health
        run: python3 scripts/release/release.py health
      - name: Record final Deployment status
        if: always() && steps.init.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/release.py finalize
      - name: Release Summary
        if: always() && steps.init.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/release.py report
      - name: Remove deployment secrets
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/backend-deploy"
          rm -f "$RELEASE_STATE_FILE"
