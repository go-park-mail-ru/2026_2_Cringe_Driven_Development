package: api
output: api.gen.go
generate:
  gorilla-server: true
  strict-server: true
  models: true
  embedded-spec: true
# Generate the implemented authentication and notebook operations.
output-options:
  include-operation-ids:
    - registerUser
    - loginUser
    - refreshToken
    - logoutUser
    - logoutAllUserSessions
    - getCurrentUser
    - listNotebooks
    - createNotebook
    - getNotebook
    - createCell
    - deleteCell
    - getNotebookContent
    - addNotebookCell
    - editNotebookCell
    - moveNotebookCell
    - removeNotebookCell
