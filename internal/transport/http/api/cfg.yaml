package: api
output: api.gen.go
generate:
  gorilla-server: true
  strict-server: true
  models: true
  embedded-spec: true
# Generate only implemented operations (API-41, API-68 and API-21). API-14 extends this list
# together with its notebook editing handlers and tests.
output-options:
  include-operation-ids:
    - registerUser
    - loginUser
    - refreshToken
    - logoutUser
    - logoutAllUserSessions
    - getCurrentUser
    - updateCurrentUser
    - changeCurrentUserPassword
    - uploadCurrentUserAvatar
    - listNotebooks
    - createNotebook
    - getNotebook
    - createCell
    - deleteCell
