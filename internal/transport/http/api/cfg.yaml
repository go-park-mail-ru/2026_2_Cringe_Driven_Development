package: api
output: api.gen.go
generate:
  gorilla-server: true
  strict-server: true
  models: true
  embedded-spec: true
# Generate the implemented authentication, user profile and notebook operations.
output-options:
  include-operation-ids:
    - registerUser
    - loginUser
    - enableTwoFactorAuth
    - confirmTwoFactorAuth
    - disableTwoFactorAuth
    - refreshToken
    - logoutUser
    - logoutAllUserSessions
    - getCurrentUser
    - updateCurrentUser
    - changeCurrentUserPassword
    - uploadCurrentUserAvatar
    - listNotebooks
    - createNotebook
    - getNotebook
    - deleteNotebook
    - createCell
    - deleteCell
    - getNotebookContent
    - addNotebookCell
    - editNotebookCell
    - moveNotebookCell
    - removeNotebookCell
    - startRuntimeSession
    - getActiveRuntimeSession
    - getRuntimeSession
    - createRuntimeExecution
    - getRuntimeExecution
    - listRuntimeEvents
    - touchRuntimeSession
    - stopRuntimeSession
    - getRuntimeQueue
    - createRuntimeExecutionBatch
    - inspectRuntimeVariables
    - getRuntimeInspection
    - interruptRuntimeKernel
    - restartRuntimeKernel
