services:
  api:
    build:
      context: .
      dockerfile: build/main.Dockerfile
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8080}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - WRITE_TIMEOUT=${WRITE_TIMEOUT:-15s}
      - READ_TIMEOUT=${READ_TIMEOUT:-15s}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_DB=${POSTGRES_DB:-app_db}
      - JWT_SECRET=${JWT_SECRET}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY}
      - BFF_API_KEY=${BFF_API_KEY}
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-15m}
      - REFRESH_TOKEN_TTL=${REFRESH_TOKEN_TTL:-720h}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis-local-development}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_DIAL_TIMEOUT=${REDIS_DIAL_TIMEOUT:-2s}
      - REDIS_OPERATION_TIMEOUT=${REDIS_OPERATION_TIMEOUT:-1s}
      # Локальные значения и сам S3 — в docker-compose.override.yml.
      - AWS_REGION=${AWS_REGION:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_ENDPOINT_URL_S3=${AWS_ENDPOINT_URL_S3:-}
      - S3_AVATARS_BUCKET=${S3_AVATARS_BUCKET:-}
      - S3_AVATARS_PUBLIC_URL=${S3_AVATARS_PUBLIC_URL:-}
      # Локальная разработка: фейковый провайдер, реальное облако не используется.
      - RUNTIME_PROVIDER=fake
      # ТОЛЬКО ДЛЯ ЛОКАЛЬНОЙ РАЗРАБОТКИ (base64 от 32 нулевых байт). Не использовать в production.
      - RUNTIME_SECRETS_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:$${PORT:-8080}/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    # Только для локальной разработки; продовая конфигурация и Vault живут в infra.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-local-development}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-redis-local-development}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --appendfsync everysec --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-app_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
