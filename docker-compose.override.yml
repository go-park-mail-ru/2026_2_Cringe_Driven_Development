# Только для локальной разработки: docker compose подхватывает этот файл сам.
# Без него (docker compose -f docker-compose.yml up) S3 не поднимается,
# и его адрес и ключи нужно задать в .env через AWS_*.
services:
  api:
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-devkey}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-devsecret}
      - AWS_ENDPOINT_URL_S3=${AWS_ENDPOINT_URL_S3:-http://s3:8333}
      - S3_NOTEBOOKS_BUCKET=${S3_NOTEBOOKS_BUCKET:-cellestial-notebooks-0}
      - S3_AVATARS_BUCKET=${S3_AVATARS_BUCKET:-cellestial-avatars-local}
      - S3_AVATARS_PUBLIC_URL=${S3_AVATARS_PUBLIC_URL:-http://localhost:${S3_PORT:-8333}/${S3_AVATARS_BUCKET:-cellestial-avatars-local}}
    depends_on:
      s3:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully

  s3:
    image: chrislusf/seaweedfs:4.48
    command: mini -dir=/data -ip=s3 -ip.bind=0.0.0.0 -bucket=${S3_NOTEBOOKS_BUCKET:-cellestial-notebooks-0},${S3_AVATARS_BUCKET:-cellestial-avatars-local}
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-devkey}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-devsecret}
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Local anonymous reads are scoped to avatars; notebooks remain private.
  s3-init:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "-ec"]
    environment:
      S3_AVATARS_BUCKET: ${S3_AVATARS_BUCKET:-cellestial-avatars-local}
    command:
      - |
        printf 's3.bucket.access -name %s -user anonymous -access Read\n' "$$S3_AVATARS_BUCKET" | weed shell -master=s3:9333 -filer=s3:8888
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"

volumes:
  s3_data:
